global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: private-lte-simulator
    metrics_path: /metrics
    static_configs:
      - targets:
          - simulator:8000
        labels:
          service: kpi-simulator
          network: private-lte

  - job_name: incident-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - incident:8080
        labels:
          service: incident-service
          network: private-lte

  - job_name: anomaly-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - anomaly:8081
        labels:
          service: anomaly-service
          network: private-lte
