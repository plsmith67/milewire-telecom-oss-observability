services:
  simulator:
    build: ./simulator
    container_name: telecom-oss-simulator
    ports:
      - "8000:8000"
    networks:
      - oss-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  incident:
    build: ./incident
    container_name: telecom-oss-incident
    ports:
      - "8080:8080"
    environment:
      INCIDENT_DB_PATH: /data/incidents.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_SEC: ${OPENAI_TIMEOUT_SEC:-45}
      AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-triage-v2}
    volumes:
      - incident-data:/data
    networks:
      - oss-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  anomaly:
    build: ./anomaly
    container_name: telecom-oss-anomaly
    ports:
      - "8081:8081"
    environment:
      ANOMALY_DB_PATH: /data/anomalies.db
      ANOMALY_CONFIG: /app/config/default.yaml
      PROMETHEUS_URL: http://prometheus:9090
      INCIDENT_WEBHOOK_URL: http://incident:8080/webhooks/anomalies
      ANOMALY_POLL_INTERVAL_SEC: ${ANOMALY_POLL_INTERVAL_SEC:-15}
      ANOMALY_BASELINE_WINDOW: ${ANOMALY_BASELINE_WINDOW:-30m}
      ANOMALY_MIN_SAMPLES: ${ANOMALY_MIN_SAMPLES:-20}
      ANOMALY_PERSIST_COUNT: ${ANOMALY_PERSIST_COUNT:-3}
      ANOMALY_RECOVER_COUNT: ${ANOMALY_RECOVER_COUNT:-2}
    volumes:
      - anomaly-data:/data
    depends_on:
      prometheus:
        condition: service_healthy
      incident:
        condition: service_healthy
    networks:
      - oss-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  alertmanager:
    build: ./alertmanager
    container_name: telecom-oss-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    depends_on:
      incident:
        condition: service_healthy
    networks:
      - oss-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  prometheus:
    build: ./prometheus
    container_name: telecom-oss-prometheus
    ports:
      - "9090:9090"
    depends_on:
      simulator:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
      incident:
        condition: service_healthy
    networks:
      - oss-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  grafana:
    build: ./grafana
    container_name: telecom-oss-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - oss-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

networks:
  oss-net:
    driver: bridge

volumes:
  alertmanager-data:
  incident-data:
  anomaly-data:
